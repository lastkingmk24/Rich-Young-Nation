name: Deploy to GitHub Pages

on:
  push:
    branches: [arena/0f3b206d-rich-young-nation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /Rich-Young-Nation/

      # GitHub Pages serves 404.html for unknown paths. Since routing is
      # client-side, a copy of index.html keeps deep links and refreshes working.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      # Fails here with "Resource not accessible by integration" until the
      # repository owner enables Pages once:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
